# Tooling configuration only. The project is run as scripts (python main.py), not
# installed as a package, so dependencies stay in requirements.txt - a single source
# of truth rather than a second list here that would drift. Requires Python >= 3.10.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Later entries take precedence, so the strict rule is listed last.
filterwarnings = [
    "default",                           # third-party warnings stay visible but non-fatal
    "error::DeprecationWarning:src.*",   # deprecations in our own code are failures
]

[tool.ruff]
line-length = 120
target-version = "py310"
# Notebooks legitimately import after %matplotlib magics and end cells with "; None".
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]
ignore = [
    # zip() without strict=: every zip in this project iterates columns of one
    # DataFrame, which are equal-length by construction.
    "B905",
    # dict(a=1) reads better than {"a": 1} for the keyword-style argument bundles
    # passed to the report writer.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# Test doubles must mirror the real signatures, so unused parameters are required.
"tests/*" = ["ARG001", "ARG002", "ARG004", "ARG005"]
# Streamlit scripts run top-to-bottom: imports follow the sys.path bootstrap.
"dashboard/app.py" = ["E402"]
"src/main.py" = ["E402"]
# Django fixes these signatures: views take `request`, commands take `*args, **options`.
"webapp/market/views.py" = ["ARG001"]
"webapp/market/management/commands/*" = ["ARG002"]
# Generated by makemigrations.
"webapp/*/migrations/*" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
